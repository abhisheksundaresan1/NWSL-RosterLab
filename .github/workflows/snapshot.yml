name: Daily 2026 snapshot

# Writes a cumulative 2026 value snapshot + the rolling form window to data/
# and commits them. Runs DAILY: Actions minutes are free and unlimited on public
# repos, ASA lags matches by 1-3 days, and the commit step below is a no-op when
# nothing changed — so a daily pull costs nothing and removes the "did the weekly
# run land before or after ASA updated?" question entirely.
#
# Snapshot FREQUENCY is deliberately independent of any comparison WINDOW. No UI
# code selects a snapshot by index; windows are defined in days by
# FORM_WINDOW_DAYS in src/analysis/form.py and resolved via
# movement.snapshot_on_or_before(). Changing this cron cannot change what any
# window on the site means.
#
# The run always uses --force, so a delayed ASA update self-corrects the next day.

on:
  schedule:
    - cron: '0 12 * * *'   # every day, 12:00 UTC
  workflow_dispatch:
    inputs:
      date:
        description: 'Cutoff date (YYYY-MM-DD, blank = yesterday)'
        required: false

permissions:
  contents: write   # needed to push the committed snapshot

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write snapshot
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/snapshot.py --date "${{ github.event.inputs.date }}" --force
          else
            python scripts/snapshot.py --force
          fi

      - name: Commit and push snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/ data/form/ data/matches/
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "snapshot: 2026 value table $(date -u +%Y-%m-%d)"
            git push
          fi
